<div class="settings-wrapper">
  <div class="settings-section">
    <h2>Change Password</h2>
    <form [formGroup]="passwordForm" (ngSubmit)="submitNewPassword()">
      <input
        type="password"
        formControlName="newPassword"
        placeholder="Enter new password"
        class="settings-input"
      />
      <button type="submit" class="settings-button primary">Save Password</button>
    </form>
  </div>

  <div class="settings-section">
    <h3>Logout</h3>
    <button class="settings-button primary" (click)="logout()">Logout</button>
  </div>

  <div class="settings-section">
    <h3>Delete Account</h3>
    <button class="settings-button danger" (click)="deleteAccount()">Delete My Account</button>
  </div>
</div>
